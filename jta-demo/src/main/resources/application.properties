server.port=8080
spring.application.name=jta-demo

# H2 em memoria - dados reais (nao mais lista estatica em Java), mas
# resetados a cada restart da aplicacao (seed via data.sql abaixo).
spring.datasource.url=jdbc:h2:mem:jtademo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# data.sql so pode rodar DEPOIS que o Hibernate cria as tabelas (ddl-auto),
# senao o INSERT falha porque a tabela ainda nao existe.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console do H2 NAO fica ligado por padrao (ver SECURITY.md, achado #2):
# sem nenhuma autenticacao configurada neste projeto, /h2-console seria
# um console SQL completo aberto para qualquer um que alcance o servidor -
# versoes antigas do H2 tiveram ate RCE de verdade via manipulacao da
# JDBC URL nesse console (ex: CVE-2021-42392, CVE-2022-23221). Para
# habilitar so em desenvolvimento local, ative o profile "dev":
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# (ver application-dev.properties)
